name: Validate plugin

on:
  push:
    branches: [main]
    paths: ['pushward-unraid.plg', 'src/**', 'build-plg.sh', '.github/workflows/validate-plg.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every assertion below is a bare test or a `|| { echo; exit 1; }`, so a step that
    # ran without -u or pipefail would let an unset variable pass as an empty match.
    # Set once here rather than per step: GitHub's own `shell: bash` gives -eo pipefail
    # but not -u, and a preamble repeated in every step is one a new step can forget.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Check the release version was bumped
        run: |
          ver=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' build-plg.sh); ver=${ver%%$'\n'*}
          printf '%s' "$ver" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[a-z]?$' \
            || { echo "::error::VERSION '$ver' is not YYYY.MM.DD with an optional letter suffix"; exit 1; }
          grep -qF "###$ver" pushward-unraid.plg \
            || { echo "::error::no ###$ver entry in <CHANGES>; the update dialog would show the previous notes"; exit 1; }
          grep -qE "<!ENTITY version +\"$ver\">" pushward-unraid.plg \
            || { echo "::error::the .plg version entity does not match VERSION=$ver"; exit 1; }
          # Unraid skips re-extracting every <FILE> payload when the version string is
          # unchanged, so shipping a payload edit without a bump delivers nothing at
          # all, silently. A same-day re-release needs a letter suffix.
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git rev-parse --verify -q "$base" >/dev/null; then
            prev=$(git show "$base:build-plg.sh" | sed -n 's/^VERSION="\([^"]*\)"/\1/p'); prev=${prev%%$'\n'*}
            if [ -n "$(git diff --name-only "$base" -- src/ pushward-unraid.plg)" ]; then
              [ "$ver" != "$prev" ] \
                || { echo "::error::payloads changed but VERSION is still $prev; the update would ship nothing"; exit 1; }
              [ "$(printf '%s\n%s\n' "$prev" "$ver" | sort | head -n1)" = "$prev" ] \
                || { echo "::error::VERSION went backwards ($prev -> $ver); Unraid compares these as plain strings"; exit 1; }
            fi
          fi

      - name: Check pushward-unraid.plg is in sync with src/
        run: |
          bash build-plg.sh /tmp/rebuilt.plg >/dev/null
          if ! diff -u pushward-unraid.plg /tmp/rebuilt.plg; then
            echo "::error::pushward-unraid.plg is stale. Run ./build-plg.sh and commit the result."
            exit 1
          fi

      - name: Install validators
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck php-cli php-mbstring >/dev/null

      - name: Validate XML
        run: xmllint --noout pushward-unraid.plg

      - name: Extract the embedded payloads
        run: |
          mkdir -p /tmp/plg
          # Extract every <FILE Name="..."> CDATA payload into /tmp/plg/<basename>.
          python3 - <<'PY'
          import re
          plg = open('pushward-unraid.plg').read()
          for name, body in re.findall(r'Name="([^"]+)"[^>]*>\s*<INLINE>\s*<!\[CDATA\[(.*?)\]\]>', plg, re.S):
              base = name.rsplit('/', 1)[-1]
              open('/tmp/plg/' + base, 'w').write(body)
              print('extracted', base)
          PY
          # Extracting every block is the point, not a side effect: this doubles as the
          # canary for the <MD5>-outside-<INLINE> invariant, since the regex wants
          # <INLINE> immediately after the open tag and a hash moved inside it makes the
          # payload unextractable. Without this count that failure would surface three
          # steps later as `php -l: Could not open input file`, blaming PHP for it.
          want=$(grep -c '<FILE Name=' pushward-unraid.plg)
          got=$(find /tmp/plg -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
          [ "$got" = "$want" ] || { echo "::error::extracted $got of $want <FILE Name> payloads - is an <MD5> inside its <INLINE>?"; exit 1; }

      - name: Check the shell scripts
        run: |
          # Bash scripts: syntax + shellcheck, straight from src/. The drift check
          # above proves the .plg embeds src/ byte for byte, so linting src/ covers
          # the embedded copies - and unlike the extractor above it also reaches the
          # <FILE Run> scripts (install-config.sh, post-install.sh, remove.sh),
          # which carry no Name= attribute and so were never checked here. Those
          # three run as root during install and uninstall. -s bash because they
          # have no shebang: the FILE block supplies the interpreter.
          for f in src/*.sh; do
            echo "== shellcheck $f =="
            bash -n "$f"
            shellcheck -s bash "$f"
          done

          # pw_cfg() is duplicated on purpose (a shared file would make the
          # uninstall path depend on the directory it deletes, and the agent lives on
          # the flash drive), so pin the copies identical instead of letting them
          # drift apart one hardening at a time. The list is derived, not spelled out:
          # by hand it would quietly stop covering the next script that grows a copy.
          # Matching calls as well as definitions, so a script that ends up calling a
          # copy it does not carry fails here rather than on a user's box, where the
          # shell's "command not found" reads as an empty API key and silence. The
          # pattern is anchored to code so a comment naming pw_cfg does not enlist a
          # file that neither defines nor calls it.
          mapfile -t cfgs < <(grep -lE '^pw_cfg\(\) \{|\$\(pw_cfg ' src/*.sh | sort)
          [ "${#cfgs[@]}" -gt 1 ] || { echo "::error::found ${#cfgs[@]} scripts using pw_cfg() - has it been renamed?"; exit 1; }
          for f in "${cfgs[@]}"; do
            grep -q '^pw_cfg() {' "$f" || { echo "::error::$f calls pw_cfg() but ships no copy of it"; exit 1; }
          done
          for f in "${cfgs[@]:1}"; do
            echo "== pw_cfg() in $f matches ${cfgs[0]} =="
            # diff and not a hash: a red build here exists to show what drifted.
            diff -u <(awk '/^pw_cfg\(\) \{/,/^\}/' "${cfgs[0]}") <(awk '/^pw_cfg\(\) \{/,/^\}/' "$f") \
              || { echo "::error::pw_cfg() in $f has drifted from ${cfgs[0]}"; exit 1; }
          done

      - name: Run the install and uninstall blocks
        run: |
          # Unraid aborts the whole install and files the .plg under plugins-error if
          # a <FILE Run> block exits non-zero, so run post-install.sh and remove.sh
          # and check the status. A textual "ends with exit 0" check passes a script
          # that has grown a `set -e` and a failing command, so it proves nothing.
          # Run as root in a container: that is how Unraid runs them, it exercises
          # the temporary /var/log/plugins marker (a marker left behind dangles and
          # makes the plugin refuse to install until a reboot), and it keeps the
          # runner clean. install-config.sh is deliberately excluded - it carries
          # `set -e` on purpose so a boot device that cannot be written aborts the
          # install rather than leaving a plugin with no config.
          echo "== post-install.sh and remove.sh exit 0, and clean up after themselves =="
          docker run --rm -v "$PWD/src:/src:ro" ubuntu:24.04 bash -c '
            set -u
            # Stub update_cron so the run can assert the marker was in place while it
            # ran, which is the entire point of standing one up. Asserting only that the
            # marker was cleaned up afterwards is satisfied by never creating it, so a
            # regression that dropped the ln -s would pass green. post-install.sh
            # silences update_cron, hence a file rather than its output.
            mkdir -p /usr/local/sbin
            printf "#!/bin/bash\n[ -L /var/log/plugins/pushward-unraid.plg ] && echo visible > /tmp/marker.seen\n" > /usr/local/sbin/update_cron
            chmod +x /usr/local/sbin/update_cron
            bash /src/post-install.sh >/tmp/pi.log 2>&1 || { echo "post-install.sh exited $?"; cat /tmp/pi.log; exit 1; }
            grep -q "PushWard Unraid plugin installed" /tmp/pi.log || { echo "no install banner"; exit 1; }
            grep -q "watchdog cron is not registered" /tmp/pi.log || { echo "missing-cron warning not printed"; exit 1; }
            [ -f /tmp/marker.seen ] || { echo "update_cron ran with no marker in place, so a first install would drop the watchdog cron"; exit 1; }
            if [ -e /var/log/plugins/pushward-unraid.plg ] || [ -L /var/log/plugins/pushward-unraid.plg ]; then
              echo "temporary marker left behind in /var/log/plugins"; exit 1
            fi
            [ -d /var/run/pushward ] || { echo "state dir not created"; exit 1; }
            bash /src/remove.sh >/dev/null 2>&1 || { echo "remove.sh exited $?"; exit 1; }
          ' || { echo "::error::an install/uninstall Run block misbehaved; Unraid would report a failed install"; exit 1; }

      - name: Check the plugin wiring invariants
        run: |
          # Every #command a settings page posts must be shipped, and shipped
          # executable - a 0644 #command dies in popen() as another silent dead
          # button. Derived from the page, because a hand-written list is exactly
          # what goes stale without anyone noticing.
          mapfile -t cmds < <(grep -ho 'name="#command"[[:space:]]*value="[^"]*"' src/*.page \
            | sed -e 's/.*value="//' -e 's/"$//' -e 's|<?= $plugin ?>|pushward-unraid|g' | sort -u)
          [ "${#cmds[@]}" -gt 0 ] || { echo "::error::no #command found - did the form markup change?"; exit 1; }
          for cmd in "${cmds[@]}"; do
            echo "== $cmd is shipped Mode=0755 =="
            grep -qF "<FILE Name=\"$cmd\" Mode=\"0755\">" pushward-unraid.plg \
              || { echo "::error::$cmd is posted by a settings page but not shipped Mode=0755"; exit 1; }
          done

          # Every <FILE Name> block needs an <MD5>, or Unraid silently never
          # replaces that file on upgrade and users stay on the old code.
          echo "== every <FILE Name> block carries an <MD5> =="
          [ "$(grep -c '<FILE Name=' pushward-unraid.plg)" = "$(grep -c '<MD5>' pushward-unraid.plg)" ] \
            || { echo "::error::a <FILE Name> block is missing its <MD5>"; exit 1; }

          # The watchdog path is written by the .cron and matched by three consumers;
          # the daemon's argv is set by watchdog.sh and matched by four patterns.
          # Rename either and every check goes quiet instead of failing.
          echo "== the watchdog path is spelled consistently =="
          grep -qF 'plugins/pushward-unraid/watchdog.sh' src/pushward-unraid.cron \
            || { echo "::error::the cron no longer runs plugins/pushward-unraid/watchdog.sh"; exit 1; }
          for f in src/post-install.sh src/apply.sh src/pushward-settings.page; do
            # The .page interpolates the plugin name, so resolve it before matching.
            # Assigned rather than piped into grep -q: under pipefail, grep -q closing
            # the pipe early makes sed die of SIGPIPE and fails the step spuriously.
            resolved=$(sed -e 's|{$plugin}|pushward-unraid|g' -e 's|<?= $plugin ?>|pushward-unraid|g' "$f")
            case "$resolved" in
              *plugins/pushward-unraid/watchdog.sh*) ;;
              *) echo "::error::$f no longer matches the path the cron writes"; exit 1 ;;
            esac
          done

          echo "== every daemon pgrep/pkill pattern matches the launched argv =="
          launch=$(grep -oE 'setsid php "\$MON" [a-z-]+' src/watchdog.sh)
          argv="php /usr/local/emhttp/plugins/pushward-unraid/pushward-monitor.php ${launch##* }"
          mapfile -t pats < <(grep -rhoE '"pushward-monitor\[?\.?\]?php [a-z-]+"' src/ | tr -d '"' | sort -u)
          [ "${#pats[@]}" -gt 0 ] || { echo "::error::no daemon match pattern found in src/"; exit 1; }
          for p in "${pats[@]}"; do
            grep -qE -- "$p" <<<"$argv" \
              || { echo "::error::pattern [$p] does not match the launched argv [$argv]"; exit 1; }
          done

      - name: Check the notification level mapping
        run: |
          # Drive the real agent with a stub curl and a temp cfg, so this covers
          # the whole script rather than an extracted fragment. Unraid hands the
          # agent only normal/warning/alert, so which level an alert lands on is
          # the operator's choice; the subject rule may only ever RAISE, because
          # Unraid's own monitor sends "Notice [...] Parity-Check finished (N
          # errors)" at importance warning and demoting on that prefix would
          # silence a parity check that found problems.
          #
          # collapse_id is asserted with the level, not left to the eye: it is the
          # whole reason a repeating SMART warning stops stacking, and every way of
          # breaking it (dropping the key, keying it off the subject, dropping the
          # server name, sending it blank) still delivers a notification and shows
          # up only as banners piling up on someone's phone.
          # The agent is extracted under the basename of its INSTALL path
          # (<FILE Name=".../notifications/agents/PushWard">), not its src/ name,
          # so it lands at /tmp/plg/PushWard.
          mkdir -p /tmp/stub
          cat > /tmp/stub/curl <<'STUB'
          #!/bin/bash
          for ((i=1;i<=$#;i++)); do
            if [ "${!i}" = "-d" ]; then j=$((i+1)); printf '%s\n' "${!j}" >> "$STUB_LOG"; fi
          done
          printf '%s' "${STUB_CODE:-200}"
          STUB
          chmod +x /tmp/stub/curl
          printf '#!/bin/sh\nexit 0\n' > /tmp/stub/logger && chmod +x /tmp/stub/logger
          export PATH=/tmp/stub:$PATH
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\n' > /tmp/agent.cfg
          export PUSHWARD_CFG=/tmp/agent.cfg PUSHWARD_STATE=/tmp/agent-state.json STUB_LOG=/tmp/agent.log
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":true}}' > /tmp/agent-state.json

          check() {  # event, subject, importance, expected level, expected slug, expected collapse_id
            : > /tmp/agent.log
            EVENT="$1" SUBJECT="$2" IMPORTANCE="$3" DESCRIPTION=d CONTENT="" LINK=http://x TIMESTAMP=1 \
              bash /tmp/plg/PushWard
            got="$(php -r '$j = json_decode(file_get_contents("/tmp/agent.log"), true);
              printf("%s %s %s", $j["level"] ?? "?", $j["activity_slug"] ?? "-", $j["collapse_id"] ?? "-");')"
            if [ "$got" != "$4 $5 $6" ]; then
              echo "FAIL: [$1 / $2 / $3] -> '$got', want '$4 $5 $6'" >&2
              exit 1
            fi
          }
          check "Unraid Disk 1 error"  "Alert [T] - disk"    alert   time-sensitive - tower-unraid-disk-1-error
          check "Unraid Disk 1 SMART"  "Warning [T] - smart" warning active         - tower-unraid-disk-1-smart
          check "Community Apps"       "Notice [T] - update" normal  passive        - tower-community-apps
          check "Unraid array errors"  "Alert [T] - errors"  ""      time-sensitive - tower-unraid-array-errors
          check "Unraid Parity-Check"  "Notice [T] - done"   warning active         tower-array tower-unraid-parity-check
          # The repeating SMART subject carries a ticking attribute value; the key
          # must not move with it, or the banners stack again.
          check "Unraid Disk 1 SMART"  "Warning [T] - smart 199" warning active - tower-unraid-disk-1-smart
          # No event, no key: a blank collapse_id would make every unlabelled
          # notification replace every other one.
          check ""                     "Notice [T] - update" normal  passive        - -

          # Past the 64-char server cap the key keeps a readable prefix and a sha1
          # tail (31 + 1 + 32), rather than truncating two long events onto one key.
          : > /tmp/agent.log
          EVENT="unraid-disk-error-on-a-very-long-event-name-that-exceeds-the-cap-by-a-lot" \
            SUBJECT=S IMPORTANCE=normal DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          php -r '$c = json_decode(file_get_contents("/tmp/agent.log"), true)["collapse_id"] ?? "";
            if (strlen($c) !== 64) { fwrite(STDERR, "FAIL: long-event key is " . strlen($c) . " chars, want 64\n"); exit(1); }'

          # A state key is never removed, so the slug is claimed only while the
          # activity is live: with active=false the notification must carry no slug.
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":false}}' > /tmp/agent-state.json
          check "Unraid Parity-Check" "Notice [T] - done" warning active - tower-unraid-parity-check
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":true}}' > /tmp/agent-state.json

          # critical is opt-in: it bypasses Do Not Disturb, and Unraid's alert
          # tier is not curated for 3am.
          printf 'PUSHWARD_ALERT_LEVEL="critical"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert critical - tower-unraid-disk-1-error
          # An unrecognised stored level falls back, matching the settings page.
          printf 'PUSHWARD_ALERT_LEVEL="urgent"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert time-sensitive - tower-unraid-disk-1-error
          # Two boxes on one account must not collapse each other's identical event.
          printf 'PUSHWARD_SERVER_NAME="Backup"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert time-sensitive - backup-unraid-disk-1-error

          # A 422 with a slug means the activity was swept between the monitor's
          # last write and this notification; retry once without it rather than
          # let a raced link swallow a disk-failure alert.
          : > /tmp/agent.log
          STUB_CODE=422 EVENT="Unraid Parity-Check" SUBJECT=N IMPORTANCE=warning DESCRIPTION=d \
            LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          test "$(wc -l < /tmp/agent.log)" = "2" || { echo "FAIL: no retry after 422" >&2; exit 1; }
          php -r '$l = file("/tmp/agent.log"); $second = json_decode($l[1], true);
            if (isset($second["activity_slug"])) { fwrite(STDERR, "FAIL: retry kept the slug\n"); exit(1); }'

          # A 5xx must not be retried into a duplicate notification.
          : > /tmp/agent.log
          STUB_CODE=500 EVENT="Unraid Parity-Check" SUBJECT=N IMPORTANCE=warning DESCRIPTION=d \
            LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          test "$(wc -l < /tmp/agent.log)" = "1" || { echo "FAIL: retried a 5xx" >&2; exit 1; }
          echo "notification level mapping ok"

      - name: Lint PHP and the page JS
        run: |
          # PHP files: lint. The .page files have a "header\n---\nbody" layout;
          # strip the header so only the PHP/HTML body is linted.
          for f in pushward-monitor.php pwapi.php; do
            echo "== php -l $f =="
            php -l "/tmp/plg/$f"
          done

          # Exercise the pure step-number math. Steps count from 1, with 0
          # meaning "not started" and total meaning "all done" - the API and the
          # phone both index that way, and an off-by-one here highlights the
          # wrong segment on every steps activity. PUSHWARD_NO_MAIN lets us
          # require the daemon without starting its loop.
          echo "== steps_current assertions =="
          php -r 'define("PUSHWARD_NO_MAIN", 1); require "/tmp/plg/pushward-monitor.php";
            foreach ([[0,5,0],[1,5,1],[5,5,5],[3,5,3],[9,5,5],[-3,5,0],[0,0,0],[1,1,1]] as [$i,$t,$w]) {
              $g = steps_current($i, $t);
              if ($g !== $w) { fwrite(STDERR, "steps_current($i,$t)=$g want $w\n"); exit(1); }
            }
            echo "steps_current ok\n";'

          # The VM-backup steps row is built from one planned-VM list, so the
          # labels and the weights come out one per VM in the same order. A label
          # past the 32-rune cap 422s the whole update, and a colours array that
          # is all-empty costs a structural push for no visible change.
          echo "== vmbackup step label/colour assertions =="
          php -r 'define("PUSHWARD_NO_MAIN", 1); require "/tmp/plg/pushward-monitor.php";
            $vms = ["win11", "ubuntu", str_repeat("x", 60), "both"];
            $labels = vmbackup_step_labels($vms);
            if (count($labels) !== 4) { fwrite(STDERR, "labels: expected one per VM\n"); exit(1); }
            if (mb_strlen($labels[2], "UTF-8") !== 32) { fwrite(STDERR, "labels: not truncated to the cap\n"); exit(1); }
            // A VM in both maps failed: red wins, or a failure reads as a skip.
            $c = vmbackup_step_colors($vms, ["ubuntu" => true, "both" => true], [$vms[2] => true, "both" => true]);
            if ($c !== ["", "red", "orange", "red"]) { fwrite(STDERR, "colors: " . json_encode($c) . "\n"); exit(1); }
            if (vmbackup_step_colors($vms, [], []) !== []) { fwrite(STDERR, "colors: an all-empty array must be dropped\n"); exit(1); }
            // No virsh on the runner, so nothing can be sized: the row falls back
            // to equal widths instead of inventing a shape.
            if (vmbackup_step_weights($vms) !== []) { fwrite(STDERR, "weights: unsized VMs must leave the row at equal widths\n"); exit(1); }
            echo "vmbackup steps ok\n";'
          for p in pushward-settings.page pushward-activities.page; do
            echo "== php -l $p (body) =="
            awk 'f{print} /^---$/{f=1}' "/tmp/plg/$p" > "/tmp/plg/$p.body.php"
            php -l "/tmp/plg/$p.body.php"
          done

          # Embedded page JS is not covered by php -l; syntax-check each <script>.
          for p in pushward-settings.page pushward-activities.page; do
            echo "== node --check $p (js) =="
            perl -0777 -ne 'print $1 while /<script[^>]*>(.*?)<\/script>/sg' "/tmp/plg/$p" > "/tmp/plg/$p.js"
            node --check "/tmp/plg/$p.js"
          done
