name: Validate plugin

on:
  push:
    branches: [main]
    paths: ['pushward-unraid.plg', 'src/**', 'tests/**', 'build-plg.sh', '.github/workflows/validate-plg.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every assertion below is a bare test or a `|| { echo; exit 1; }`, so a step that
    # ran without -u or pipefail would let an unset variable pass as an empty match.
    # Set once here rather than per step: GitHub's own `shell: bash` gives -eo pipefail
    # but not -u, and a preamble repeated in every step is one a new step can forget.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the release version was bumped
        run: |
          ver=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' build-plg.sh); ver=${ver%%$'\n'*}
          printf '%s' "$ver" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[a-z]?$' \
            || { echo "::error::VERSION '$ver' is not YYYY.MM.DD with an optional letter suffix"; exit 1; }
          grep -qF "###$ver" pushward-unraid.plg \
            || { echo "::error::no ###$ver entry in <CHANGES>; the update dialog would show the previous notes"; exit 1; }
          grep -qE "<!ENTITY version +\"$ver\">" pushward-unraid.plg \
            || { echo "::error::the .plg version entity does not match VERSION=$ver"; exit 1; }
          # Unraid skips re-extracting every <FILE> payload when the version string is
          # unchanged, so shipping a payload edit without a bump delivers nothing at
          # all, silently. A same-day re-release needs a letter suffix.
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if git rev-parse --verify -q "$base" >/dev/null; then
            prev=$(git show "$base:build-plg.sh" | sed -n 's/^VERSION="\([^"]*\)"/\1/p'); prev=${prev%%$'\n'*}
            if [ -n "$(git diff --name-only "$base" -- src/ pushward-unraid.plg)" ]; then
              [ "$ver" != "$prev" ] \
                || { echo "::error::payloads changed but VERSION is still $prev; the update would ship nothing"; exit 1; }
              [ "$(printf '%s\n%s\n' "$prev" "$ver" | sort | head -n1)" = "$prev" ] \
                || { echo "::error::VERSION went backwards ($prev -> $ver); Unraid compares these as plain strings"; exit 1; }
            fi
          fi

      - name: Check pushward-unraid.plg is in sync with src/
        run: |
          bash build-plg.sh /tmp/rebuilt.plg >/dev/null
          if ! diff -u pushward-unraid.plg /tmp/rebuilt.plg; then
            echo "::error::pushward-unraid.plg is stale. Run ./build-plg.sh and commit the result."
            exit 1
          fi

      - name: Install validators
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck php-cli php-mbstring >/dev/null

      - name: Validate XML
        run: xmllint --noout pushward-unraid.plg

      - name: Extract the embedded payloads
        run: |
          mkdir -p /tmp/plg
          # Extract every <FILE Name="..."> CDATA payload into /tmp/plg/<basename>.
          python3 - <<'PY'
          import re
          plg = open('pushward-unraid.plg').read()
          for name, body in re.findall(r'Name="([^"]+)"[^>]*>\s*<INLINE>\s*<!\[CDATA\[(.*?)\]\]>', plg, re.S):
              base = name.rsplit('/', 1)[-1]
              open('/tmp/plg/' + base, 'w').write(body)
              print('extracted', base)
          PY
          # Extracting every block is the point, not a side effect: this doubles as the
          # canary for the <MD5>-outside-<INLINE> invariant, since the regex wants
          # <INLINE> immediately after the open tag and a hash moved inside it makes the
          # payload unextractable. Without this count that failure would surface three
          # steps later as `php -l: Could not open input file`, blaming PHP for it.
          want=$(grep -c '<FILE Name=' pushward-unraid.plg)
          got=$(find /tmp/plg -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
          [ "$got" = "$want" ] || { echo "::error::extracted $got of $want <FILE Name> payloads - is an <MD5> inside its <INLINE>?"; exit 1; }

      - name: Check the shell scripts
        run: |
          # Bash scripts: syntax + shellcheck, straight from src/. The drift check
          # above proves the .plg embeds src/ byte for byte, so linting src/ covers
          # the embedded copies - and unlike the extractor above it also reaches the
          # <FILE Run> scripts (install-config.sh, post-install.sh, remove.sh),
          # which carry no Name= attribute and so were never checked here. Those
          # three run as root during install and uninstall. -s bash because they
          # have no shebang: the FILE block supplies the interpreter.
          for f in src/*.sh; do
            echo "== shellcheck $f =="
            bash -n "$f"
            shellcheck -s bash "$f"
          done

          # pw_cfg() is duplicated on purpose (a shared file would make the
          # uninstall path depend on the directory it deletes, and the agent lives on
          # the flash drive), so pin the copies identical instead of letting them
          # drift apart one hardening at a time. The list is derived, not spelled out:
          # by hand it would quietly stop covering the next script that grows a copy.
          # Matching calls as well as definitions, so a script that ends up calling a
          # copy it does not carry fails here rather than on a user's box, where the
          # shell's "command not found" reads as an empty API key and silence. The
          # pattern is anchored to code so a comment naming pw_cfg does not enlist a
          # file that neither defines nor calls it.
          mapfile -t cfgs < <(grep -lE '^pw_cfg\(\) \{|\$\(pw_cfg ' src/*.sh | sort)
          [ "${#cfgs[@]}" -gt 1 ] || { echo "::error::found ${#cfgs[@]} scripts using pw_cfg() - has it been renamed?"; exit 1; }
          for f in "${cfgs[@]}"; do
            grep -q '^pw_cfg() {' "$f" || { echo "::error::$f calls pw_cfg() but ships no copy of it"; exit 1; }
          done
          for f in "${cfgs[@]:1}"; do
            echo "== pw_cfg() in $f matches ${cfgs[0]} =="
            # diff and not a hash: a red build here exists to show what drifted.
            diff -u <(awk '/^pw_cfg\(\) \{/,/^\}/' "${cfgs[0]}") <(awk '/^pw_cfg\(\) \{/,/^\}/' "$f") \
              || { echo "::error::pw_cfg() in $f has drifted from ${cfgs[0]}"; exit 1; }
          done

      - name: Run the install and uninstall blocks
        run: |
          # Unraid aborts the whole install and files the .plg under plugins-error if
          # a <FILE Run> block exits non-zero, so run post-install.sh and remove.sh
          # and check the status. A textual "ends with exit 0" check passes a script
          # that has grown a `set -e` and a failing command, so it proves nothing.
          # Run as root in a container: that is how Unraid runs them, it exercises
          # the temporary /var/log/plugins marker (a marker left behind dangles and
          # makes the plugin refuse to install until a reboot), and it keeps the
          # runner clean. install-config.sh is deliberately excluded - it carries
          # `set -e` on purpose so a boot device that cannot be written aborts the
          # install rather than leaving a plugin with no config.
          echo "== post-install.sh and remove.sh exit 0, and clean up after themselves =="
          docker run --rm -v "$PWD/src:/src:ro" ubuntu:24.04 bash -c '
            set -u
            # Stub update_cron so the run can assert the marker was in place while it
            # ran, which is the entire point of standing one up. Asserting only that the
            # marker was cleaned up afterwards is satisfied by never creating it, so a
            # regression that dropped the ln -s would pass green. post-install.sh
            # silences update_cron, hence a file rather than its output.
            mkdir -p /usr/local/sbin
            printf "#!/bin/bash\n[ -L /var/log/plugins/pushward-unraid.plg ] && echo visible > /tmp/marker.seen\n" > /usr/local/sbin/update_cron
            chmod +x /usr/local/sbin/update_cron
            bash /src/post-install.sh >/tmp/pi.log 2>&1 || { echo "post-install.sh exited $?"; cat /tmp/pi.log; exit 1; }
            grep -q "PushWard Unraid plugin installed" /tmp/pi.log || { echo "no install banner"; exit 1; }
            grep -q "watchdog cron is not registered" /tmp/pi.log || { echo "missing-cron warning not printed"; exit 1; }
            [ -f /tmp/marker.seen ] || { echo "update_cron ran with no marker in place, so a first install would drop the watchdog cron"; exit 1; }
            if [ -e /var/log/plugins/pushward-unraid.plg ] || [ -L /var/log/plugins/pushward-unraid.plg ]; then
              echo "temporary marker left behind in /var/log/plugins"; exit 1
            fi
            [ -d /var/run/pushward ] || { echo "state dir not created"; exit 1; }
            bash /src/remove.sh >/dev/null 2>&1 || { echo "remove.sh exited $?"; exit 1; }
          ' || { echo "::error::an install/uninstall Run block misbehaved; Unraid would report a failed install"; exit 1; }

      - name: Check the plugin wiring invariants
        run: |
          # Every #command a settings page posts must be shipped, and shipped
          # executable - a 0644 #command dies in popen() as another silent dead
          # button. Derived from the page, because a hand-written list is exactly
          # what goes stale without anyone noticing.
          mapfile -t cmds < <(grep -ho 'name="#command"[[:space:]]*value="[^"]*"' src/*.page \
            | sed -e 's/.*value="//' -e 's/"$//' -e 's|<?= $plugin ?>|pushward-unraid|g' | sort -u)
          [ "${#cmds[@]}" -gt 0 ] || { echo "::error::no #command found - did the form markup change?"; exit 1; }
          for cmd in "${cmds[@]}"; do
            echo "== $cmd is shipped Mode=0755 =="
            grep -qF "<FILE Name=\"$cmd\" Mode=\"0755\">" pushward-unraid.plg \
              || { echo "::error::$cmd is posted by a settings page but not shipped Mode=0755"; exit 1; }
          done

          # Every <FILE Name> block needs an <MD5>, or Unraid silently never
          # replaces that file on upgrade and users stay on the old code.
          echo "== every <FILE Name> block carries an <MD5> =="
          [ "$(grep -c '<FILE Name=' pushward-unraid.plg)" = "$(grep -c '<MD5>' pushward-unraid.plg)" ] \
            || { echo "::error::a <FILE Name> block is missing its <MD5>"; exit 1; }

          # The watchdog path is written by the .cron and matched by three consumers;
          # the daemon's argv is set by watchdog.sh and matched by four patterns.
          # Rename either and every check goes quiet instead of failing.
          echo "== the watchdog path is spelled consistently =="
          grep -qF 'plugins/pushward-unraid/watchdog.sh' src/pushward-unraid.cron \
            || { echo "::error::the cron no longer runs plugins/pushward-unraid/watchdog.sh"; exit 1; }
          for f in src/post-install.sh src/apply.sh src/pushward-settings.page; do
            # The .page interpolates the plugin name, so resolve it before matching.
            # Assigned rather than piped into grep -q: under pipefail, grep -q closing
            # the pipe early makes sed die of SIGPIPE and fails the step spuriously.
            resolved=$(sed -e 's|{$plugin}|pushward-unraid|g' -e 's|<?= $plugin ?>|pushward-unraid|g' "$f")
            case "$resolved" in
              *plugins/pushward-unraid/watchdog.sh*) ;;
              *) echo "::error::$f no longer matches the path the cron writes"; exit 1 ;;
            esac
          done

          echo "== every daemon pgrep/pkill pattern matches the launched argv =="
          launch=$(grep -oE 'setsid php "\$MON" [a-z-]+' src/watchdog.sh)
          argv="php /usr/local/emhttp/plugins/pushward-unraid/pushward-monitor.php ${launch##* }"
          mapfile -t pats < <(grep -rhoE '"pushward-monitor\[?\.?\]?php [a-z-]+"' src/ | tr -d '"' | sort -u)
          [ "${#pats[@]}" -gt 0 ] || { echo "::error::no daemon match pattern found in src/"; exit 1; }
          for p in "${pats[@]}"; do
            grep -qE -- "$p" <<<"$argv" \
              || { echo "::error::pattern [$p] does not match the launched argv [$argv]"; exit 1; }
          done

      - name: Check the notification level mapping
        run: |
          # Drive the real agent with a stub curl and a temp cfg, so this covers
          # the whole script rather than an extracted fragment. Unraid hands the
          # agent only normal/warning/alert, so which level an alert lands on is
          # the operator's choice; the subject rule may only ever RAISE, because
          # Unraid's own monitor sends "Notice [...] Parity-Check finished (N
          # errors)" at importance warning and demoting on that prefix would
          # silence a parity check that found problems.
          #
          # collapse_id is asserted with the level, not left to the eye: it is the
          # whole reason a repeating SMART warning stops stacking, and every way of
          # breaking it (dropping the key, keying it off the subject, dropping the
          # server name, sending it blank) still delivers a notification and shows
          # up only as banners piling up on someone's phone.
          # The agent is extracted under the basename of its INSTALL path
          # (<FILE Name=".../notifications/agents/PushWard">), not its src/ name,
          # so it lands at /tmp/plg/PushWard.
          mkdir -p /tmp/stub
          # The stub logs each notification payload, answers with the next
          # status from STUB_CODES (the last one repeats; STUB_CODE for a single
          # one) and on a non-2xx writes the matching body from STUB_BODIES
          # (STUB_BODY for one) to the -o file, the way the server explains a
          # refusal. A receipt cancel answers STUB_CANCEL_CODE
          # (000 fails like a dead network) and is kept apart from the payload
          # log; /tmp/agent-calls records the order of both.
          cat > /tmp/stub/curl <<'STUB'
          #!/bin/bash
          out=/dev/null; data=""; url=""
          for ((i=1;i<=$#;i++)); do
            j=$((i+1))
            case "${!i}" in
              -d) data="${!j}" ;;
              -o) out="${!j}" ;;
              http*) url="${!i}" ;;
            esac
          done
          if [ "${url%/notifications/receipts/cancel}" != "$url" ]; then
            printf 'cancel %s\n' "$data" >> /tmp/agent-calls
            code="${STUB_CANCEL_CODE:-200}"
            [ "$code" != 000 ] || { printf 000; exit 7; }
            printf '{"canceled":1}' > "$out"; printf '%s' "$code"; exit 0
          fi
          printf 'notify\n' >> /tmp/agent-calls
          printf '%s\n' "$data" >> "$STUB_LOG"
          read -r -a codes <<< "${STUB_CODES:-${STUB_CODE:-200}}"
          read -r -a bodies <<< "${STUB_BODIES:-${STUB_BODY:-}}"
          n=$(wc -l < "$STUB_LOG")
          code="${codes[n-1]:-${codes[-1]}}"
          body=""; [ "${#bodies[@]}" -eq 0 ] || body="${bodies[n-1]:-${bodies[-1]}}"
          case "$code" in 2*) printf '{}' ;; *) printf '%s' "$body" ;; esac > "$out"
          printf '%s' "$code"
          STUB
          chmod +x /tmp/stub/curl
          cat > /tmp/stub/logger <<'STUB'
          #!/bin/sh
          printf '%s\n' "$*" >> /tmp/agent-syslog
          STUB
          chmod +x /tmp/stub/logger
          export PATH=/tmp/stub:$PATH
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\n' > /tmp/agent.cfg
          export PUSHWARD_CFG=/tmp/agent.cfg PUSHWARD_STATE=/tmp/agent-state.json STUB_LOG=/tmp/agent.log
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":true}}' > /tmp/agent-state.json

          check() {  # event, subject, importance, expected level, expected slug, expected collapse_id
            : > /tmp/agent.log
            EVENT="$1" SUBJECT="$2" IMPORTANCE="$3" DESCRIPTION=d CONTENT="" LINK=http://x TIMESTAMP=1 \
              bash /tmp/plg/PushWard
            got="$(php -r '$j = json_decode(file_get_contents("/tmp/agent.log"), true);
              printf("%s %s %s", $j["level"] ?? "?", $j["activity_slug"] ?? "-", $j["collapse_id"] ?? "-");')"
            if [ "$got" != "$4 $5 $6" ]; then
              echo "FAIL: [$1 / $2 / $3] -> '$got', want '$4 $5 $6'" >&2
              exit 1
            fi
          }
          check "Unraid Disk 1 error"  "Alert [T] - disk"    alert   time-sensitive - tower-unraid-disk-1-error
          check "Unraid Disk 1 SMART"  "Warning [T] - smart" warning active         - tower-unraid-disk-1-smart
          check "Community Apps"       "Notice [T] - update" normal  passive        - tower-community-apps
          check "Unraid array errors"  "Alert [T] - errors"  ""      time-sensitive - tower-unraid-array-errors
          check "Unraid Parity-Check"  "Notice [T] - done"   warning active         tower-array tower-unraid-parity-check
          # The repeating SMART subject carries a ticking attribute value; the key
          # must not move with it, or the banners stack again.
          check "Unraid Disk 1 SMART"  "Warning [T] - smart 199" warning active - tower-unraid-disk-1-smart
          # "Unraid Status" is what notify files a notification without -e under
          # (User Scripts, many plugins): unrelated ones, so the subject joins in,
          # and only through the hash. A slug keeps a-z and 0-9, so subjects in
          # another script, or that differ only in accents or punctuation, would
          # collide in it.
          gid() { printf 'tower-unraid-status-%s' "$(printf '%s\0%s' Tower "Unraid Status|$1" | sha1sum | cut -c1-32)"; }
          for subject in "Notice [T] - backup done" "Notice [T] - sync done" "Backup: done!" "Backup - done?" \
            $'\xe5\xa4\x87\xe4\xbb\xbd\xe5\xae\x8c\xe6\x88\x90' $'\xe5\x90\x8c\xe6\xad\xa5\xe5\xa4\xb1\xe8\xb4\xa5' $'caf\xc3\xa9' $'caf\xc3\xa8'; do
            check "Unraid Status" "$subject" normal passive - "$(gid "$subject")"
          done
          # No event, no key: a blank collapse_id would make every unlabelled
          # notification replace every other one.
          check ""                     "Notice [T] - update" normal  passive        - -

          # Past the 64-char server cap the key keeps a readable prefix and a sha1
          # tail (31 + 1 + 32), rather than truncating two long events onto one key.
          : > /tmp/agent.log
          EVENT="unraid-disk-error-on-a-very-long-event-name-that-exceeds-the-cap-by-a-lot" \
            SUBJECT=S IMPORTANCE=normal DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          php -r '$c = json_decode(file_get_contents("/tmp/agent.log"), true)["collapse_id"] ?? "";
            if (strlen($c) !== 64) { fwrite(STDERR, "FAIL: long-event key is " . strlen($c) . " chars, want 64\n"); exit(1); }'

          # A state key is never removed, so the slug is claimed only while the
          # activity is live: with active=false the notification must carry no slug.
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":false}}' > /tmp/agent-state.json
          check "Unraid Parity-Check" "Notice [T] - done" warning active - tower-unraid-parity-check
          echo '{"_meta":{"prefix":"tower"},"tower-array":{"active":true}}' > /tmp/agent-state.json

          # critical is opt-in: it bypasses Do Not Disturb, and Unraid's alert
          # tier is not curated for 3am.
          printf 'PUSHWARD_ALERT_LEVEL="critical"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert critical - tower-unraid-disk-1-error
          # An unrecognised stored level falls back, matching the settings page.
          printf 'PUSHWARD_ALERT_LEVEL="urgent"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert time-sensitive - tower-unraid-disk-1-error
          # Two boxes on one account must not collapse each other's identical event.
          printf 'PUSHWARD_SERVER_NAME="Backup"\n' >> /tmp/agent.cfg
          check "Unraid Disk 1 error" "Alert [T] - disk" alert time-sensitive - backup-unraid-disk-1-error

          # A 422 with a slug means the activity was swept between the monitor's
          # last write and this notification; retry once without it rather than
          # let a raced link swallow a disk-failure alert.
          : > /tmp/agent.log
          STUB_CODE=422 EVENT="Unraid Parity-Check" SUBJECT=N IMPORTANCE=warning DESCRIPTION=d \
            LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          test "$(wc -l < /tmp/agent.log)" = "2" || { echo "FAIL: no retry after 422" >&2; exit 1; }
          php -r '$l = file("/tmp/agent.log"); $second = json_decode($l[1], true);
            if (isset($second["activity_slug"])) { fwrite(STDERR, "FAIL: retry kept the slug\n"); exit(1); }'

          # A 5xx must not be retried into a duplicate notification.
          : > /tmp/agent.log
          STUB_CODE=500 EVENT="Unraid Parity-Check" SUBJECT=N IMPORTANCE=warning DESCRIPTION=d \
            LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          test "$(wc -l < /tmp/agent.log)" = "1" || { echo "FAIL: retried a 5xx" >&2; exit 1; }
          echo "notification level mapping ok"

          # End-to-end encryption. The agent seals with PHP it carries inline (the
          # flash-drive copy can not lean on the plugin directory), so pull that
          # block out between its markers and hold it to the published pw1
          # vectors with their fixed nonces. The vector file is pinned, so it can
          # not be edited into agreement with a broken seal.
          echo "82a670607d831801d5f9054da8d500086c8324146b133d17967966d55493c265  tests/e2e-vectors-v1.json" \
            | sha256sum -c --quiet || { echo "::error::tests/e2e-vectors-v1.json is not the published pw1 vector file"; exit 1; }
          { echo '<?php'; awk '/\/\/ pw-e2e begin/,/\/\/ pw-e2e end/' /tmp/plg/PushWard; } > /tmp/pw-e2e.php
          grep -q 'function pw_e2e_seal_plaintext' /tmp/pw-e2e.php || { echo "::error::no pw-e2e block in the agent"; exit 1; }
          php -r 'require "/tmp/pw-e2e.php";
            $v = json_decode(file_get_contents("tests/e2e-vectors-v1.json"), true);
            $sealed = 0; $serialized = 0;
            foreach ($v["seal"] as $t) {
              $key = pw_e2e_key($t["key_hex"]);
              $env = pw_e2e_seal_plaintext($key, $t["plaintext"], hex2bin($t["nonce_hex"]));
              if (pw_e2e_kid($key) !== $t["kid"] || $env !== $t["envelope"]) { fwrite(STDERR, "FAIL: seal vector {$t["name"]}\n"); exit(1); }
              $sealed++;
              // Where a vector holds only what a sender writes, the agent must
              // write the same bytes (padding aside).
              if (json_decode($t["plaintext"], true) === $t["expect"]) {
                $e = $t["expect"];
                $json = json_encode(pw_e2e_fields($e["title"], $e["body"], $e["subtitle"] ?? "", $e["url"] ?? ""), PW_E2E_JSON);
                if ($json !== rtrim($t["plaintext"], " ")) { fwrite(STDERR, "FAIL: serialized {$t["name"]} as $json\n"); exit(1); }
                $serialized++;
              }
            }
            if ($sealed < 9 || $serialized < 5) { fwrite(STDERR, "FAIL: only $sealed seal and $serialized serializer vectors ran\n"); exit(1); }
            foreach (["hlk_" . str_repeat("a", 60), "hla_" . str_repeat("a", 60), str_repeat("a", 63), str_repeat("g", 64)] as $bad) {
              try { pw_e2e_key($bad); fwrite(STDERR, "FAIL: accepted the key $bad\n"); exit(1); } catch (InvalidArgumentException $e) {}
            }
            // Python json.dumps(ensure_ascii=False) leaves U+2028 raw; so must this.
            if (json_encode(pw_e2e_fields("a\u{2028}/b", "c", "", ""), PW_E2E_JSON) !== "{\"title\":\"a\u{2028}/b\",\"body\":\"c\"}") {
              fwrite(STDERR, "FAIL: U+2028 or a slash is escaped in the sealed JSON\n"); exit(1);
            }
            if (pw_e2e_key(" 000102030405060708090A0B0C0D0E0F\n101112131415161718191a1b1c1d1e1f ") !== hex2bin($v["seal"][0]["key_hex"])) {
              fwrite(STDERR, "FAIL: a key with spaces or upper case did not parse\n"); exit(1);
            }
            echo "pw1 vectors ok ($sealed sealed, $serialized serialized)\n";'

          # The settings page shows a Key ID it derives on its own; it has to be
          # the one the app shows, so hold it to the vectors too.
          { echo '<?php'; awk '/^function pw_e2e_status\(/,/^}/' /tmp/plg/pushward-settings.page; } > /tmp/page-e2e.php
          php -r 'require "/tmp/page-e2e.php";
            foreach (json_decode(file_get_contents("tests/e2e-vectors-v1.json"), true)["seal"] as $t) {
              $got = pw_e2e_status(" " . strtoupper($t["key_hex"]) . "\n");
              if ($got[1] !== "Key ID " . $t["kid"]) { fwrite(STDERR, "FAIL: the page shows " . json_encode($got) . " for kid {$t["kid"]}\n"); exit(1); }
            }
            if (pw_e2e_status("") !== null || pw_e2e_status("hlk_x")[0] !== "bad" || pw_e2e_status("abcd")[0] !== "bad") {
              fwrite(STDERR, "FAIL: the page misreads an empty or invalid key\n"); exit(1);
            }'

          # The test opens what the agent sends with its own opener, written from
          # the format rather than from the agent, so a bug the seal and an
          # opener could share does not cancel out. It opens a vector first.
          cat > /tmp/pw1-open.php <<'PHP'
          <?php
          function fail(string $why) { fwrite(STDERR, "FAIL: $why\n"); exit(1); }
          function pw1_open(string $keyHex, string $envelope): string {
              $key = hex2bin($keyHex);
              $kid = bin2hex(hash_hkdf('sha256', $key, 4, 'pushward/e2e/v1/kid'));
              if (strlen($envelope) > 3072) { fail('envelope is ' . strlen($envelope) . ' characters, over 3072'); }
              if (!preg_match('/^pw1\.([0-9a-f]{8})\.([A-Za-z0-9_-]+)$/', $envelope, $m) || $m[1] !== $kid) { fail("not a pw1 envelope for key $kid"); }
              $raw = base64_decode(strtr($m[2], '-_', '+/'), true);
              $plain = openssl_decrypt(substr($raw, 12, -16), 'aes-256-gcm', hash_hkdf('sha256', $key, 32, 'pushward/e2e/v1/enc'),
                  OPENSSL_RAW_DATA, substr($raw, 0, 12), substr($raw, -16), "pw1.$kid");
              if ($plain === false) { fail('the envelope does not open'); }
              return $plain;
          }
          // What the agent sent, one JSON object per stub log line, and the
          // sealed message inside it, checked for the 64-byte padding.
          function sent(int $i = 0): array { return json_decode(file('/tmp/agent.log')[$i], true, 512, JSON_THROW_ON_ERROR); }
          function opened(string $keyHex, array $j): array {
              foreach (['title', 'subtitle', 'body', 'url'] as $k) { if (array_key_exists($k, $j)) { fail("a sealed payload carries $k in the clear"); } }
              $plain = pw1_open($keyHex, $j['encrypted'] ?? '');
              $padded = intdiv(strlen($plain) + 63, 64) * 64;
              if ($padded <= 2266 && strlen($plain) !== $padded) { fail('plaintext of ' . strlen($plain) . ' bytes is not padded to 64'); }
              if (strlen($plain) > 2266) { fail('plaintext over 2266 bytes'); }
              return json_decode($plain, true, 512, JSON_THROW_ON_ERROR);
          }
          PHP
          php -r 'require "/tmp/pw1-open.php";
            $t = json_decode(file_get_contents("tests/e2e-vectors-v1.json"), true)["seal"][1];
            if (json_decode(pw1_open($t["key_hex"], $t["envelope"]), true) !== $t["expect"]) { fail("the test opener can not open a vector"); }'

          KEY_A=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          # Upper case and padded with spaces: the agent takes the key the way
          # people paste it.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_E2E_KEY=" %s "\n' "${KEY_A^^}" > /tmp/agent.cfg
          : > /tmp/agent.log; : > /tmp/agent-syslog
          EVENT="Unraid Disk 1 error" SUBJECT="Alert [T] - disk 1 failed" IMPORTANCE=alert DESCRIPTION="Array health" \
            CONTENT="Disk 1 is in an error state" LINK="https://tower.local/Main" TIMESTAMP=1700000000 bash /tmp/plg/PushWard
          sent="$(cat /tmp/agent.log /tmp/agent-syslog)"
          case "${sent,,}" in *"$KEY_A"*) echo "FAIL: the encryption key left the box" >&2; exit 1 ;; esac
          php -r 'require "/tmp/pw1-open.php";
            $raw = file_get_contents("/tmp/agent.log"); $j = sent();
            foreach (["Disk 1 is in an error state", "disk 1 failed", "tower.local", "Unraid Disk 1 error"] as $s) {
              if (str_contains($raw, $s)) { fail("the sealed payload leaks [$s]"); }
            }
            if (isset($j["metadata"]["event"])) { fail("metadata.event survived sealing"); }
            if ($j["metadata"] !== ["importance" => "alert", "server" => "Tower", "timestamp" => "1700000000"]) { fail("readable metadata: " . json_encode($j["metadata"])); }
            // With a key the event hash is an HMAC under a key derived from it,
            // so it can not be matched against a list of likely event names.
            $tagKey = hash_hkdf("sha256", hex2bin($argv[1]), 32, "pushward/unraid/v1/event-tag");
            if (($j["collapse_id"] ?? "") !== "unraid-" . substr(hash_hmac("sha256", "Tower|Unraid Disk 1 error", $tagKey), 0, 16)) { fail("collapse_id " . ($j["collapse_id"] ?? "-")); }
            if ($j["level"] !== "time-sensitive" || isset($j["acknowledge"])) { fail("level or an unasked acknowledge changed by sealing"); }
            $want = ["title" => "Alert [T] - disk 1 failed", "subtitle" => "Unraid \u{b7} Tower", "body" => "Disk 1 is in an error state", "url" => "https://tower.local/Main"];
            if (opened($argv[1], $j) !== $want) { fail("opened " . json_encode(opened($argv[1], $j))); }
            echo "sealed notification ok\n";' -- "$KEY_A"

          # The link is sealed only as an absolute http(s) URL: a web UI path gets
          # the configured base, anything else is left out.
          link() {  # LINK, expected sealed url or -
            : > /tmp/agent.log
            EVENT=e SUBJECT=S IMPORTANCE=normal CONTENT=c LINK="$1" TIMESTAMP=1 bash /tmp/plg/PushWard
            got="$(php -r 'require "/tmp/pw1-open.php"; echo opened($argv[1], sent())["url"] ?? "-";' -- "$KEY_A")"
            [ "$got" = "$2" ] || { echo "FAIL: LINK [$1] sealed as '$got', want '$2'" >&2; exit 1; }
          }
          link /Main -
          link "javascript:alert(1)" -
          link "https://tower.local/Main" "https://tower.local/Main"
          printf 'PUSHWARD_WEBUI_URL="http://tower.local:8080/"\n' >> /tmp/agent.cfg
          link /Settings/Notifications "http://tower.local:8080/Settings/Notifications"
          link Main -
          link //evil.example/x -

          # Unencrypted, the link takes the same route: a web UI path gets the
          # base or is left out, since the server refuses a bare path.
          sed '/^PUSHWARD_E2E_KEY=/d' /tmp/agent.cfg > /tmp/agent-plain.cfg
          for want in "/Main http://tower.local:8080/Main" "javascript:alert(1) -" "https://x.example/a https://x.example/a"; do
            : > /tmp/agent.log
            PUSHWARD_CFG=/tmp/agent-plain.cfg EVENT=e SUBJECT=S IMPORTANCE=normal CONTENT=c LINK="${want% *}" TIMESTAMP=1 bash /tmp/plg/PushWard
            got="$(php -r 'require "/tmp/pw1-open.php"; $u = sent()["url"] ?? "?"; echo $u === "" ? "-" : $u;')"
            [ "$got" = "${want#* }" ] || { echo "FAIL: plain LINK [${want% *}] sent as '$got'" >&2; exit 1; }
          done

          # The live-activity link survives sealing; the plain event name does not.
          : > /tmp/agent.log
          EVENT="Unraid Parity-Check" SUBJECT=N IMPORTANCE=warning CONTENT=c LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          php -r 'require "/tmp/pw1-open.php"; $j = sent();
            if (($j["activity_slug"] ?? "") !== "tower-array") { fail("sealing dropped the activity link"); }
            if (stripos(json_encode($j), "parity") !== false) { fail("the event name is readable in a sealed payload"); }'

          # Long text is cut to fit one envelope, the body first and never through
          # a character: 3-byte CJK, 4-byte emoji, U+2028 and characters JSON
          # escapes to 2 or 6 bytes all have to be counted right. Only a link too
          # long to leave room for any text is dropped instead.
          fit() {  # SUBJECT, CONTENT, LINK, title characters expected ("cut": fewer than 256), link kept (yes/no)
            : > /tmp/agent.log
            EVENT=e SUBJECT="$1" IMPORTANCE=alert CONTENT="$2" LINK="$3" TIMESTAMP=1 bash /tmp/plg/PushWard
            php -r 'require "/tmp/pw1-open.php"; $m = opened($argv[1], sent());
              [, , $subject, $content, $link, $titleLen, $linkKept] = $argv;
              // What the agent saw: a byte that is not UTF-8 arrives as U+FFFD.
              $clean = fn($s) => json_decode(json_encode($s, JSON_INVALID_UTF8_SUBSTITUTE));
              if ($m["body"] === "" || !str_starts_with($clean($content), $m["body"])) { fail("the body is not a prefix of the content"); }
              if ($m["title"] === "" || !str_starts_with($clean($subject), $m["title"])) { fail("the title is not a prefix of the subject"); }
              $got = mb_strlen($m["title"]);
              if ($titleLen === "cut" ? $got >= 256 : $got !== (int) $titleLen) { fail("title of $got characters, want $titleLen"); }
              if (($m["url"] ?? null) !== ($linkKept === "yes" ? $link : null)) { fail("link kept: " . ($m["url"] ?? "none")); }' \
              -- "$KEY_A" "$1" "$2" "$3" "$4" "$5"
          }
          L=https://tower.local/Main
          fit "$(printf 'T%.0s' {1..300})" "$(php -r 'echo str_repeat("\u{4e2d}", 3000);')" "$L" 256 yes
          fit "Escapes" "$(php -r 'echo str_repeat("a\x01\"\\\n\u{1F525}\u{2028}/", 600);')" "$L" 7 yes
          fit "$(php -r 'echo str_repeat("\u{1F525}", 300);')" "$(php -r 'echo str_repeat("\x01", 3000);')" "$L" 256 yes
          fit "$(php -r 'echo str_repeat("\x01", 300);')" "body" "$L/$(printf 'p%.0s' {1..1500})" cut yes
          fit "Long link" "body" "$L/$(printf 'p%.0s' {1..3000})" 9 no
          fit "Bad byte" $'\xff then text' "$L" 8 yes

          # Without AES-256-GCM in PHP the alert still goes out content-free, and
          # the warning openssl_encrypt() prints must not land in the payload,
          # whatever the box's display_errors says. A copy of the agent asks for
          # a cipher no PHP has, run by a php that prints every warning to stdout.
          sed 's/"aes-256-gcm"/"aes-256-none"/' /tmp/plg/PushWard > /tmp/agent-nocipher
          ! cmp -s /tmp/plg/PushWard /tmp/agent-nocipher || { echo "::error::the cipher name was not found in the agent"; exit 1; }
          mkdir -p /tmp/stub-php
          printf '#!/bin/sh\nexec %s -d display_errors=1 -d error_reporting=-1 "$@"\n' "$(command -v php)" > /tmp/stub-php/php
          chmod +x /tmp/stub-php/php
          : > /tmp/agent.log; : > /tmp/agent-syslog
          PATH="/tmp/stub-php:$PATH" EVENT=e SUBJECT="Alert [T] - secret subject" IMPORTANCE=alert CONTENT="secret content" \
            LINK=x TIMESTAMP=1 bash /tmp/agent-nocipher
          php -r 'require "/tmp/pw1-open.php"; $j = sent();
            if (($j["body"] ?? "") !== "Encryption unavailable on this server, check the PushWard plugin settings" || isset($j["encrypted"])) { fail("no AES-256-GCM: " . json_encode($j)); }
            if (str_contains(file_get_contents("/tmp/agent.log"), "secret")) { fail("no AES-256-GCM leaked the alert"); }'
          case "$(cat /tmp/agent-syslog)" in *"encryption failed"*) ;; *) echo "FAIL: no log line for the missing cipher" >&2; exit 1 ;; esac
          # Anything else on stdout ahead of the builder (a php.ini prepend, a
          # noisy extension) garbles the event tag line: logged, nothing posted.
          mkdir -p /tmp/stub-noisy
          printf '#!/bin/sh\necho "Deprecated: something noisy"\nexec %s "$@"\n' "$(command -v php)" > /tmp/stub-noisy/php
          chmod +x /tmp/stub-noisy/php
          : > /tmp/agent.log; : > /tmp/agent-syslog
          PATH="/tmp/stub-noisy:$PATH" EVENT=e SUBJECT=S IMPORTANCE=alert CONTENT=c LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          [ ! -s /tmp/agent.log ] || { echo "FAIL: posted a garbled build: $(cat /tmp/agent.log)" >&2; exit 1; }
          case "$(cat /tmp/agent-syslog)" in *"could not be built"*) ;; *) echo "FAIL: a garbled build was not logged" >&2; exit 1 ;; esac

          # A key that can not be used sends a content-free alert in the clear:
          # the phone still hears about it, the details stay on the box, and the
          # log names the problem without the key.
          for bad in "hlk_notakey" "0001" "zz${KEY_A:2}"; do
            printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_E2E_KEY="%s"\n' "$bad" > /tmp/agent.cfg
            : > /tmp/agent.log; : > /tmp/agent-syslog
            EVENT="Unraid Parity-Check" SUBJECT="Alert [T] - secret subject" IMPORTANCE=alert CONTENT="secret content" \
              LINK="https://tower.local/Main" TIMESTAMP=1 bash /tmp/plg/PushWard
            php -r 'require "/tmp/pw1-open.php"; $j = sent();
              $want = ["title" => "Unraid alert on Tower", "body" => "Encryption key invalid, check the PushWard plugin settings", "level" => "time-sensitive"];
              if (array_intersect_key($j, $want) !== $want) { fail("not the content-free alert: " . json_encode($j)); }
              foreach (["subtitle", "url", "encrypted", "activity_slug"] as $k) { if (isset($j[$k])) { fail("content-free alert carries $k"); } }
              if (isset($j["metadata"]["event"]) || str_contains(file_get_contents("/tmp/agent.log"), "secret")) { fail("content-free alert leaks the event"); }'
            syslog="$(cat /tmp/agent-syslog)"
            case "$syslog" in *"encryption key"*"invalid"*) ;; *) echo "FAIL: no log line for the bad key [$bad]" >&2; exit 1 ;; esac
            case "$syslog" in *"$bad"*) echo "FAIL: the log shows the key" >&2; exit 1 ;; esac
          done

          # Repeat until acknowledged: only when switched on, only for what
          # arrived as an alert, with the bounds clamped to the server's.
          # Each alert carries two tags: the server, and the event hashed with it.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\n' > /tmp/agent.cfg
          etag() { printf 'unraid-%s' "$(printf '%s|%s' "$1" "${2:-e}" | sha1sum | cut -c1-16)"; }
          ack() {  # importance, subject, expected "repeat expire tags" or -
            : > /tmp/agent.log
            EVENT="${EVENT-e}" SUBJECT="$2" IMPORTANCE="$1" DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
            got="$(php -r 'require "/tmp/pw1-open.php"; $j = sent(); $a = $j["acknowledge"] ?? null;
              echo $a === null ? (isset($j["tags"]) ? "tags-without-acknowledge" : "-")
                : $a["repeat_seconds"] . " " . $a["expire_seconds"] . " " . implode(",", $j["tags"] ?? []);')"
            [ "$got" = "$3" ] || { echo "FAIL: acknowledge for [$1 / $2] -> '$got', want '$3'" >&2; exit 1; }
          }
          ack alert   "Alert [T] - disk"   "300 3600 unraid-tower,$(etag Tower)"
          ack warning "Warning [T] - smart" -
          ack normal  "Notice [T] - update" -
          ack normal  "Alert [T] - raised"  "300 3600 unraid-tower,$(etag Tower)"
          ack warning "Alert [T] - stays"   -
          EVENT="" ack alert "Alert [T] - no event" "300 3600 unraid-tower"
          printf 'PUSHWARD_ACK_REPEAT="5"\nPUSHWARD_ACK_EXPIRE="99999"\n' >> /tmp/agent.cfg
          ack alert "Alert [T] - disk" "30 10800 unraid-tower,$(etag Tower)"
          printf 'PUSHWARD_ACK_REPEAT="soon"\nPUSHWARD_ACK_EXPIRE=""\nPUSHWARD_SERVER_NAME="My Tower #2"\n' >> /tmp/agent.cfg
          ack alert "Alert [T] - disk" "300 3600 unraid-my-tower-2,$(etag 'My Tower #2')"
          long="$(printf 'x%.0s' {1..100})"
          printf 'PUSHWARD_SERVER_NAME="%s"\n' "$long" >> /tmp/agent.cfg
          ack alert "Alert [T] - disk" "300 3600 unraid-$(printf 'x%.0s' {1..57}),$(etag "$long")"
          printf 'PUSHWARD_SERVER_NAME="!!!"\n' >> /tmp/agent.cfg
          ack alert "Alert [T] - disk" "300 3600 unraid-$(printf '!!!' | sha1sum | cut -c1-12),$(etag '!!!')"
          printf 'PUSHWARD_ACK="0"\n' >> /tmp/agent.cfg
          ack alert "Alert [T] - disk" -
          # Sealing leaves the acknowledge readable: the server has to run it.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\nPUSHWARD_E2E_KEY="%s"\n' "$KEY_A" > /tmp/agent.cfg
          hetag() {  # server, event, key hex -> the event tag with a key set
            php -r 'echo "unraid-", substr(hash_hmac("sha256", $argv[1] . "|" . $argv[2],
              hash_hkdf("sha256", hex2bin($argv[3]), 32, "pushward/unraid/v1/event-tag")), 0, 16);' -- "$@"
          }
          ack alert "Alert [T] - disk" "300 3600 unraid-tower,$(hetag Tower e "$KEY_A")"
          php -r 'require "/tmp/pw1-open.php"; opened($argv[1], sent());' -- "$KEY_A"
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\n' > /tmp/agent.cfg
          EVENT="Unraid Status" ack alert "Alert [T] - script failed" "300 3600 unraid-tower,$(etag Tower 'Unraid Status|Alert [T] - script failed')"
          EVENT="Unraid Status" ack alert "Alert [T] - other script" "300 3600 unraid-tower,$(etag Tower 'Unraid Status|Alert [T] - other script')"

          # The recovery notice for an event stops that event's repeats first,
          # or a late repeat would cover it on the Lock Screen (both carry the
          # same collapse id). Only with repeats on, never for an alert, and a
          # failed cancel never holds the notice back.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\n' > /tmp/agent.cfg
          calls() {  # cancel code, importance, expected calls (comma separated)
            : > /tmp/agent.log; : > /tmp/agent-calls; : > /tmp/agent-syslog
            STUB_CANCEL_CODE="$1" EVENT="Unraid Disk 1 error" SUBJECT="Notice [T] - back to normal" IMPORTANCE="$2" \
              DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
            got="$(sed -e "s/^cancel {\"tag\":\"$(etag Tower 'Unraid Disk 1 error')\"}\$/cancel/" /tmp/agent-calls | paste -sd, -)"
            [ "$got" = "$3" ] || { echo "FAIL: calls for [$1 / $2] -> '$got', want '$3'" >&2; exit 1; }
          }
          calls 200 normal  cancel,notify
          calls 200 warning cancel,notify
          calls 200 alert   notify
          calls 500 normal  cancel,notify
          case "$(cat /tmp/agent-syslog)" in *"could not stop"*) ;; *) echo "FAIL: a failed cancel was not logged" >&2; exit 1 ;; esac
          calls 000 normal  cancel,notify
          : > /tmp/agent-calls
          EVENT="" SUBJECT="Notice [T] - no event" IMPORTANCE=normal DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          [ "$(cat /tmp/agent-calls)" = "notify" ] || { echo "FAIL: canceled without an event" >&2; exit 1; }
          # A generic notice belongs to no alert, so it cancels nothing.
          : > /tmp/agent-calls
          EVENT="Unraid Status" SUBJECT="Notice [T] - script done" IMPORTANCE=normal DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          [ "$(cat /tmp/agent-calls)" = "notify" ] || { echo "FAIL: a generic notice canceled repeats" >&2; exit 1; }
          printf 'PUSHWARD_ACK="0"\n' >> /tmp/agent.cfg
          calls 200 normal notify

          # With a key, the alert and its recovery notice still agree on the tag:
          # the alert carries it and uses it as collapse id, the notice cancels it,
          # and also the plain sha1 tag an alert from 2026.10.08 may still carry.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\nPUSHWARD_E2E_KEY="%s"\n' "$KEY_A" > /tmp/agent.cfg
          : > /tmp/agent.log; : > /tmp/agent-calls
          EVENT="Unraid Disk 1 error" SUBJECT="Alert [T] - disk" IMPORTANCE=alert CONTENT=c LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          EVENT="Unraid Disk 1 error" SUBJECT="Notice [T] - disk back" IMPORTANCE=normal CONTENT=c LINK=x TIMESTAMP=2 bash /tmp/plg/PushWard
          php -r 'require "/tmp/pw1-open.php"; $a = sent(0); $b = sent(1);
            $tag = $argv[1];
            if (($a["tags"][1] ?? "") !== $tag || $a["collapse_id"] !== $tag || $b["collapse_id"] !== $tag) { fail("alert and notice disagree on the event tag: " . json_encode([$a["tags"] ?? null, $a["collapse_id"], $b["collapse_id"]])); }
            $legacy = "unraid-" . substr(sha1("Tower|Unraid Disk 1 error"), 0, 16);
            if (file("/tmp/agent-calls", FILE_IGNORE_NEW_LINES) !== ["notify", "cancel {\"tag\":\"$tag\"}", "cancel {\"tag\":\"$legacy\"}", "notify"]) { fail("calls: " . file_get_contents("/tmp/agent-calls")); }' \
            -- "$(hetag Tower 'Unraid Disk 1 error' "$KEY_A")"
          # Both cancels are tried when the first fails, and the notice still goes out.
          : > /tmp/agent.log; : > /tmp/agent-calls; : > /tmp/agent-syslog
          STUB_CANCEL_CODE=000 EVENT="Unraid Disk 1 error" SUBJECT="Notice [T] - disk back" IMPORTANCE=normal CONTENT=c LINK=x \
            TIMESTAMP=2 bash /tmp/plg/PushWard
          [ "$(cut -c1-6 /tmp/agent-calls | paste -sd, -)" = "cancel,cancel,notify" ] || { echo "FAIL: failed cancels: $(cat /tmp/agent-calls)" >&2; exit 1; }
          [ "$(grep -c 'could not stop' /tmp/agent-syslog)" = 2 ] || { echo "FAIL: each failed cancel is logged" >&2; exit 1; }

          # A refused acknowledge must not lose the alert: on the refusals that
          # create nothing, resend once without acknowledge and tags. Never after
          # an auth failure, a rate limit or a 5xx, which would only duplicate
          # the alert or fail again.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\n' > /tmp/agent.cfg
          fallback() {  # status, problem code, expected sends
            : > /tmp/agent.log
            STUB_CODES="$1 200" STUB_BODY="{\"status\":$1,\"code\":\"$2\"}" EVENT=e SUBJECT=S IMPORTANCE=alert DESCRIPTION=d \
              LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
            sends="$(wc -l < /tmp/agent.log)"
            [ "$sends" = "$3" ] || { echo "FAIL: HTTP $1 [$2] -> $sends sends, want $3" >&2; exit 1; }
            php -r 'require "/tmp/pw1-open.php"; $first = sent();
              if (!isset($first["acknowledge"], $first["tags"])) { fail("the first send carried no acknowledge"); }
              if ($argv[1] === "2") {
                unset($first["acknowledge"], $first["tags"]);
                if (sent(1) !== $first) { fail("the resend is not the alert without acknowledge: " . json_encode(sent(1))); }
              }' -- "$3"
          }
          fallback 409 notification_receipt.limit_exceeded 2
          fallback 422 notification_receipt.disabled 2
          fallback 422 notification.answer_url_unavailable 2
          fallback 422 notification.encrypted_too_large 2
          fallback 400 notification.invalid 2
          fallback 422 "" 2
          fallback 409 activity.limit_exceeded 1
          fallback 401 auth.invalid_key 1
          fallback 403 auth.forbidden 1
          fallback 429 rate_limit.exceeded 1
          fallback 500 "" 1
          fallback 000 "" 1
          # A stale slug and the acknowledge are separate refusals: a 422 naming
          # the slug drops only the slug, and the acknowledge goes out with it.
          : > /tmp/agent.log
          STUB_CODES="422 200" STUB_BODY='{"code":"notification.activity_not_found"}' EVENT="Unraid Parity-Check" \
            SUBJECT="Alert [T] - parity" IMPORTANCE=alert DESCRIPTION=d LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
          php -r 'require "/tmp/pw1-open.php";
            if (count(file("/tmp/agent.log")) !== 2) { fail("no resend after a stale slug"); }
            $a = sent(0); $b = sent(1);
            if (($a["activity_slug"] ?? "") !== "tower-array" || isset($b["activity_slug"]) || !isset($b["acknowledge"])) { fail("stale slug resend: " . json_encode($b)); }'

          # An organization key can not send encrypted notifications, and the
          # server refuses each one with 422 encryption_unavailable. The alert
          # still goes out, once more, as the content-free alert, without what
          # an earlier refusal already dropped.
          printf 'PUSHWARD_API_KEY="hlk_x"\nPUSHWARD_SERVER_NAME="Tower"\nPUSHWARD_ACK="1"\nPUSHWARD_E2E_KEY="%s"\n' "$KEY_A" > /tmp/agent.cfg
          org() {  # event, statuses, refusal codes, expected sends as encrypted|plain + ack|- (+slug)
            : > /tmp/agent.log; : > /tmp/agent-syslog
            bodies=""; for c in $3; do bodies="$bodies {\"code\":\"$c\"}"; done
            STUB_CODES="$2" STUB_BODIES="$bodies" EVENT="$1" SUBJECT="Alert [T] - secret subject" IMPORTANCE=alert \
              CONTENT="secret content" LINK=x TIMESTAMP=1 bash /tmp/plg/PushWard
            got="$(php -r 'require "/tmp/pw1-open.php";
              foreach (file("/tmp/agent.log") as $i => $line) {
                $j = sent($i);
                $kind = isset($j["encrypted"]) ? "encrypted" : (($j["body"] ?? "") === "Encryption is not available for organization keys, check the PushWard plugin settings" ? "plain" : "other");
                $out[] = $kind . "+" . (isset($j["acknowledge"]) ? "ack" : "-") . (isset($j["activity_slug"]) ? "+slug" : "");
              }
              echo implode(",", $out);')"
            [ "$got" = "$4" ] || { echo "FAIL: organization key [$2 / $3] -> '$got', want '$4'" >&2; exit 1; }
            # Every send, the content-free resend included, keeps the keyed event
            # tag as collapse id and second tag, and nothing names the event.
            php -r 'require "/tmp/pw1-open.php";
              foreach (file("/tmp/agent.log") as $i => $line) {
                $j = sent($i);
                if (($j["collapse_id"] ?? "") !== $argv[1]) { fail("send $i collapse_id " . ($j["collapse_id"] ?? "-") . ", want $argv[1]"); }
                if (isset($j["acknowledge"]) && ($j["tags"][1] ?? "") !== $argv[1]) { fail("send $i tags " . json_encode($j["tags"] ?? null)); }
                if (stripos($line, "parity") !== false) { fail("send $i names the event"); }
              }' -- "$(hetag Tower "$1" "$KEY_A")"
            case "$(cat /tmp/agent.log)" in *secret*) echo "FAIL: the organization resend leaked the alert" >&2; exit 1 ;; esac
            case "$(cat /tmp/agent-syslog)" in *organization*) ;; *) echo "FAIL: no log line for the organization key" >&2; exit 1 ;; esac
          }
          org e "422 200" notification.encryption_unavailable "encrypted+ack,plain+ack"
          org e "409 422 200" "notification_receipt.limit_exceeded notification.encryption_unavailable" "encrypted+ack,encrypted+-,plain+-"
          org "Unraid Parity-Check" "422 422 409 200" \
            "notification.activity_not_found notification.encryption_unavailable notification_receipt.limit_exceeded" \
            "encrypted+ack+slug,encrypted+ack,plain+ack,plain+-"
          echo "encryption and acknowledge ok"

      - name: Lint PHP and the page JS
        run: |
          # PHP files: lint. The .page files have a "header\n---\nbody" layout;
          # strip the header so only the PHP/HTML body is linted.
          for f in pushward-monitor.php pwapi.php; do
            echo "== php -l $f =="
            php -l "/tmp/plg/$f"
          done

          # Exercise the pure step-number math. Steps count from 1, with 0
          # meaning "not started" and total meaning "all done" - the API and the
          # phone both index that way, and an off-by-one here highlights the
          # wrong segment on every steps activity. PUSHWARD_NO_MAIN lets us
          # require the daemon without starting its loop.
          echo "== steps_current assertions =="
          php -r 'define("PUSHWARD_NO_MAIN", 1); require "/tmp/plg/pushward-monitor.php";
            foreach ([[0,5,0],[1,5,1],[5,5,5],[3,5,3],[9,5,5],[-3,5,0],[0,0,0],[1,1,1]] as [$i,$t,$w]) {
              $g = steps_current($i, $t);
              if ($g !== $w) { fwrite(STDERR, "steps_current($i,$t)=$g want $w\n"); exit(1); }
            }
            echo "steps_current ok\n";'

          # The VM-backup steps row is built from one planned-VM list, so the
          # labels and the weights come out one per VM in the same order. A label
          # past the 32-rune cap 422s the whole update, and a colours array that
          # is all-empty costs a structural push for no visible change.
          echo "== vmbackup step label/colour assertions =="
          php -r 'define("PUSHWARD_NO_MAIN", 1); require "/tmp/plg/pushward-monitor.php";
            $vms = ["win11", "ubuntu", str_repeat("x", 60), "both"];
            $labels = vmbackup_step_labels($vms);
            if (count($labels) !== 4) { fwrite(STDERR, "labels: expected one per VM\n"); exit(1); }
            if (mb_strlen($labels[2], "UTF-8") !== 32) { fwrite(STDERR, "labels: not truncated to the cap\n"); exit(1); }
            // A VM in both maps failed: red wins, or a failure reads as a skip.
            $c = vmbackup_step_colors($vms, ["ubuntu" => true, "both" => true], [$vms[2] => true, "both" => true]);
            if ($c !== ["", "red", "orange", "red"]) { fwrite(STDERR, "colors: " . json_encode($c) . "\n"); exit(1); }
            if (vmbackup_step_colors($vms, [], []) !== []) { fwrite(STDERR, "colors: an all-empty array must be dropped\n"); exit(1); }
            // No virsh on the runner, so nothing can be sized: the row falls back
            // to equal widths instead of inventing a shape.
            if (vmbackup_step_weights($vms) !== []) { fwrite(STDERR, "weights: unsized VMs must leave the row at equal widths\n"); exit(1); }
            echo "vmbackup steps ok\n";'
          for p in pushward-settings.page pushward-activities.page; do
            echo "== php -l $p (body) =="
            awk 'f{print} /^---$/{f=1}' "/tmp/plg/$p" > "/tmp/plg/$p.body.php"
            php -l "/tmp/plg/$p.body.php"
          done

          # Embedded page JS is not covered by php -l; syntax-check each <script>.
          for p in pushward-settings.page pushward-activities.page; do
            echo "== node --check $p (js) =="
            perl -0777 -ne 'print $1 while /<script[^>]*>(.*?)<\/script>/sg' "/tmp/plg/$p" > "/tmp/plg/$p.js"
            node --check "/tmp/plg/$p.js"
          done
